module: components/control/manipulation
tests:
  - name: manipulation-mujoco-world-contract
    description: Named state, actuator mapping, reset and physical fault handling without rendering.
    category: functional
    scopes: [pr, scheduled, release]
    timeout_s: 300
    workdir: sdk
    command: |
      cmake -S components/control/manipulation/simulation/mujoco -B output/test/manipulation-mujoco-world -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      cmake --build output/test/manipulation-mujoco-world -j2
      ctest --test-dir output/test/manipulation-mujoco-world --output-on-failure

  - name: native-manipulation-contract
    description: Device contracts, Mock, Nero fake-SDK/IPC and signal tests; no device access.
    category: functional
    scopes: [pr, scheduled, release]
    timeout_s: 600
    workdir: sdk
    command: |
      bash components/thirdparty/pyagxarm/tools/setup_sdk.sh
      cmake -S components/control/manipulation -B output/test/manipulation-contract -DCMAKE_BUILD_TYPE=Release -DMANIPULATION_ENABLE_NERO=ON -DMANIPULATION_LOCK_DIRECTORY="$PWD/output/test/manipulation-locks"
      cmake --build output/test/manipulation-contract -j2
      ctest --test-dir output/test/manipulation-contract --output-on-failure
  - name: manipulation-stack-software
    description: Optional OpenCV calibration, installed consumers, registered extension and cup application; no hardware.
    category: functional
    scopes: [scheduled, release]
    timeout_s: 1200
    workdir: sdk
    command: |
      bash components/thirdparty/pyagxarm/tools/setup_sdk.sh
      bash components/control/manipulation/tools/verify_stack.sh "$PWD/output/test/manipulation-stack"
  - name: manipulation-mujoco-physics
    description: Headless physics, UR5e/Robotiq assets, registered simulation drivers and relocation.
    category: functional
    scopes: [scheduled, release]
    timeout_s: 900
    workdir: sdk
    command: |
      bash components/thirdparty/pyagxarm/tools/setup_sdk.sh
      python3 components/control/manipulation/tools/prepare_simulation_assets.py
      cmake -S components/control/manipulation -B output/test/manipulation-mujoco -DCMAKE_BUILD_TYPE=Release -DMANIPULATION_ENABLE_MUJOCO=ON -DMANIPULATION_ENABLE_NERO=OFF -DMANIPULATION_ENABLE_SO101=OFF -DMANIPULATION_ENABLE_CALIBRATION=OFF -DCMAKE_INSTALL_PREFIX="$PWD/output/test/manipulation-mujoco/install"
      cmake --build output/test/manipulation-mujoco -j2
      ctest --test-dir output/test/manipulation-mujoco --output-on-failure
      cmake --install output/test/manipulation-mujoco
      python3 components/control/manipulation/tests/check_simulation_install.py output/test/manipulation-mujoco/install
      python3 components/control/manipulation/tests/check_simulation_build.py output/test/manipulation-mujoco/install
