# The scene contains the gripper; this plan only exposes the arm interface.
schema_version: 3
device:
    arm:
        driver: mujoco
        device_id: arm_main
        resource_id: simulation_ur5e_robotiq
        options:
            mapping_file: ../../descriptions/simulation/ur5e_robotiq/mapping.yaml
        tolerance_rad: 0.012
        timeout_s: 15.0
        joints:
            - {name: shoulder_pan_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: shoulder_lift_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: elbow_joint, minimum_rad: -3.1415, maximum_rad: 3.1415}
            - {name: wrist_1_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: wrist_2_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
            - {name: wrist_3_joint, minimum_rad: -6.2831, maximum_rad: 6.2831}
steps:
    - capability: joint_point
      target_rad: [-1.45, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
      speed_scale: 0.2
    - capability: joint_point
      target_rad: [-1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 0.0]
      speed_scale: 0.2
