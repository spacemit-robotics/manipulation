# Registered capabilities on a deterministic device; no hardware is accessed.
schema_version: 3
device:
  driver: mock_device
  arm:
    device_id: arm
    resource_id: capability_sequence_mock
    joints:
      - {name: joint1, minimum_rad: -1, maximum_rad: 1}
  effector:
    device_id: gripper
    channels: [finger]
    feedback: position
steps:
  - {capability: joint_point, target_rad: [0.1], speed_scale: 0.05}
  - {capability: effector_position, positions: [0.5], duration_s: 0.1}
  - {capability: joint_jog, joint_index: 0, delta_rad: 0.1, speed_scale: 0.05}
  - capability: joint_path
    waypoints_rad: [[0.1], [0.0]]
    max_velocity_rad_s: 0.2
    max_acceleration_rad_s2: 0.2
  - capability: joint_trajectory
    times_s: [0, 0.05]
    positions_rad: [[0], [0.01]]
    command_rate_hz: 100
  - {capability: arm_hold}
  - {capability: effector_hold}
