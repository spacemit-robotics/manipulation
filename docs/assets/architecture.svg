<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="714" viewBox="0 0 960 714" role="img" aria-labelledby="title desc">
  <title id="title">manipulation 系统架构</title>
  <desc id="desc">调用方经 C++ DeviceSession 或 Python DeviceClient 使用组件；DeviceClient 启动本机进程 manipulation-device，经 JSONL 调用设备会话，C++ 应用在进程内直接创建设备会话。设备会话负责设备独占、到位判定、取消、超时和故障锁定，并调用按 device.driver 创建的驱动，如 Mock、Nero / Revo2、SO101 或扩展驱动。右侧为运动学、手眼标定、配置解析、机型描述和 SO101 舵机校准等能力与工具。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="714" fill="#ffffff"/>
  <g font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
