    <text x="311" y="112.1" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">固定顺序动作</text>
    <rect class="box" x="388" y="56" width="130" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
