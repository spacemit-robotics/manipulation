    <text x="169" y="103.8" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">链接组件库</text>
    <rect class="box" x="246" y="56" width="130" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
