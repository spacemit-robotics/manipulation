    <text x="453" y="112.1" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">配置 · 示教 · 点动</text>
    <rect class="box" x="530" y="56" width="130" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="595" y="77.3" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Python 应用</text>
    <text x="595" y="95.6" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">如 dice_arena</text>
    <text x="595" y="112.1" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">抓杯与游戏</text>

