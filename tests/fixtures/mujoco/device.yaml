schema_version: 3
device:
  arm:
    driver: mujoco
    device_id: simulation_arm
    resource_id: mujoco_fixture_world
    joints:
      - {name: second_joint, minimum_rad: -1, maximum_rad: 1}
      - {name: first_joint, minimum_rad: -1, maximum_rad: 1}
    timeout_s: 5
    tolerance_rad: 0.005
    options: {mapping_file: mapping.yaml}
  effector:
    driver: mujoco
    device_id: simulation_tool
    resource_id: mujoco_fixture_world
    channels: [gripper]
    feedback: position
    timeout_s: 5
    tolerance: 0.01
    options: {mapping_file: mapping.yaml}
steps:
  - {capability: joint_point, target_rad: [0.12, -0.08], speed_scale: 0.8}
  - {capability: effector_position, positions: [0.3], duration_s: 0.15}
